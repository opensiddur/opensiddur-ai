[project]
name = "opensiddur-ai"
version = "0.4.0"
description = "AI-aided conversion and compilation pipeline for Open Siddur liturgical texts (JLPTEI v2)"
authors = [
    {name = "Efraim Feinstein", email = "efraim.feinstein@gmail.com"}
]
license = {text = "LGPL 3+"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = [
    "open-siddur",
    "liturgy",
    "tei",
    "xml",
    "xslt",
    "hebrew",
    "pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "requests>=2.32.4",
    "lxml>=5.3.0",
    "saxonche>=12.7.0",
    "mwparserfromhell>=0.7.2",
    "pydantic>=2.11.7",
    "openpyxl>=3.1.5",
    "pyluach>=2.3.0",
    "hdate>=1.2.1",
    "tzfpy>=1.3.2",
    "pillow>=11.0.0",
    "pyyaml>=6.0.3",
    "pypdf>=6.10.2",
]

[project.urls]
Homepage = "https://opensiddur.org/"
Repository = "https://github.com/opensiddur/opensiddur-ai"
Issues = "https://github.com/opensiddur/opensiddur-ai/issues"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "coverage>=7.0.0",
]
test = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opensiddur"]
