---
# Example exporter settings file.
# This file includes every currently supported exporter settings 
#
# Notes:
# - Project names must correspond to directories under `project/`.
# - `parallel.column_order` values: `primary_first` | `primary_last`
# - `typography.layout` values: `pages` | `pairs`
# - `typography.paper` values: `a4paper` | `letterpaper` | `legalpaper` | `a5paper` | `b5paper` | `executivepaper`

priority:
  # Project priority for resolving `urn:x-opensiddur:` references to *texts* (transclusions)
  # The first entry will typically be the project you are compiling.
  # The lower priority projects can be used when the first project wants to import from others (eg, a siddur that borrows Tanach text from another source)
  transclusion:
    - wlc
    - jps1917

  # Project priority for resolving `urn:x-opensiddur:` references to *instructions*
  instructions:
    - wlc
    - jps1917

# Projects from which to include annotations
# *All* annotations from the given projects will be included.
annotations:
  - wlc
  - jps1917

# Optional parallel-text configuration. Omit to disable.
parallel:
  # Projects to search for parallel text content (in priority order)
  projects:
    - wlc
    - jps1917
  # Column order for parallel text display in printed output
  column_order: primary_first

# Optional conditional setting declarations (processor init).
# Keys are tei:fs @type values; nested keys are tei:f @name values.
# Omit to leave conditional settings unset at compile start.
declarations:
  opensiddur:gregorian-date:
    year: 2024
    month: 10
    day: 3
  opensiddur:time:
    hour: 10
    minute: 30
    second: 0
  opensiddur:holiday:
    rosh-hashana: 1
    pesah: 0
  opensiddur:override:
    omit-tahanun: true
  # Who is present. Unset means undefined, which keeps conditional passages together with
  # the instruction saying when to read them. Setting minyan true derives zimmun true.
  opensiddur:quorum:
    minyan: true
    present-not-eaten: false
  # Textual variants are selected by URN; see the URN section of schema/JLPTEI-3.md.
  opensiddur:variant:
    urn:x-opensiddur:condition:haggadah:magid/lefikach/shira_chadasha: true
  # Rite, for passages that differ by custom (most often the haftarah). Each rite is its own
  # binary, so several may be true at once and every selected variant is kept. Omitting this
  # group entirely leaves rite undefined, which keeps *all* variants along with the headings
  # naming whose custom they are — usually what a printed volume wants. The list is open;
  # see schema/JLPTEI-3.md for the known names.
  opensiddur:rite:
    ashkenaz: true
    teimani_baladi: true

# Output-format settings consumed by the TeX/PDF stage only.
typography:
  # Every key below is optional, and every default is what this exporter produced
  # before any of it was configurable. doc/typography.md is the full reference:
  # every key, its type, its allowed values, its default and what it affects.
  #
  # Every key is also checked. An unknown key, a value outside a closed list, a
  # malformed length or a font chain with nothing installed is an error naming
  # the path, raised before anything is rendered.

  # Font families, each a chain tried in order — the first one installed wins,
  # and none of them being installed is an error rather than a silent fallback.
  # `latin` and `hebrew` always exist; declaring one replaces its default chain.
  # Declare your own and point a style at it by name.
  fonts:
    hebrew: ["Frank Ruehl CLM", "Ezra SIL", "SBL Hebrew", "FreeSerif"]
    latin: ["Linux Libertine O", "TeX Gyre Pagella", "FreeSerif"]

  page:
    paper: letterpaper       # a4paper | letterpaper | legalpaper | a5paper
                             # | b5paper | executivepaper | custom
    orientation: portrait    # portrait | landscape
    sides: two               # two: margins and running heads mirror between
                             # recto and verso. one: printed on one side only.
    chapter_start: recto     # recto: a book opens on a right-hand page
    base_font_size: "11pt"   # 10pt | 11pt | 12pt — what named sizes scale from
    # Margins are named for the binding, not the page edge, so they mean the same
    # on a recto and a verso. Omitted margins keep the document class's own.
    margins:
      top: "1in"
      bottom: "1in"
      inner: "1.25in"        # at the binding edge
      outer: "0.9in"         # at the fore edge
      # binding_offset: "5mm"  # for the part of the page a binding swallows

  paragraphs:
    indent: "0pt"
    spacing: "0.5em"
    line_spacing: 1.0        # 0.5-3.0. Pointed Hebrew wants more than unpointed.
    alignment: justify       # justify | left | right | center

  # The appearance of each kind of text. Every role takes the same keys — font,
  # size, weight, style, variant, align, space_before, space_after — and an
  # omitted one leaves that aspect as the surrounding text has it. Sizes are the
  # named ladder (xxx-small ... xxxx-large), which follows base_font_size, or an
  # absolute length like 9pt, which does not.
  styles:
    heading1: {size: xx-large, weight: bold, align: center}
    heading2: {size: x-large, weight: bold, align: center}
    note: {size: "9pt"}
    note_mark: {size: xx-small}
    # ... and body, heading3, heading4, title_main, title_sub, title_alt,
    # byline, edition, imprint, epigraph, imprimatur, title_page_block,
    # citation, parsha, aliyah, verse_number, chapter_number, instruction,
    # line_number, section_separator. See doc/typography.md.

  line_numbers:
    enabled: true
    unit: page               # page | section — what numbering restarts at
    increment: 5             # a number every nth line
    first: 5                 # so they run 5, 10, 15 rather than 1, 5, 10
    margin: outer            # inner | outer | left | right
    separation: "1em"
    numerals: arabic         # arabic | hebrew

  notes:
    placement: footnote      # footnote | endnote | none
    anchor: interlinear      # interlinear: raised above the line and zero-width,
                             # so the annotated text is not respaced — which is
                             # what keeps two sides of a parallel text aligned.
                             # superscript | inline are the alternatives.
    mark: numeric            # numeric | alpha | roman | symbol

  markers:
    section_separator: "* * * *"   # between sections that carry no heading
    verse_numbers: shown           # shown | hidden
    chapter_numbers: shown
    # Only conditions the compiler could not decide survive into the output, so a
    # marker means "say this only if ...". A whole paragraph takes a rule rather
    # than brackets: brackets several lines apart do not read as a pair.
    conditional:
      inline_open: "["
      inline_close: "]"
      block: rule                  # rule | brackets | none
      rule_width: "25%"
      rule_thickness: "0.4pt"

  parallel:
    layout: pairs            # pairs: two columns on a page. pages: facing pages,
                             # which gives each text a full measure.
    column_width: "43%"      # of the text block; the gap takes the remainder,
                             # which is also what leaves room for line numbers
    column_position: center  # left | center | right
    # Which text goes on which side is `parallel.column_order` above, not here.

  table_of_contents:
    enabled: false
    depth: 4                 # 1-4; independent of the PDF bookmark depth

  # Running heads and feet. Omit both sections to leave the book class's own
  # page style alone.
  #
  # Each takes either `all` (the same on every page) or `odd` and/or `even`.
  # Combining `all` with `odd` or `even` is an error.
  #
  # `left`, `center` and `right` are *physical* page positions. Each is either a
  # bare string or a mapping of:
  #   text      - the template
  #   language  - the slot's base direction, which sets the order its runs are laid
  #               out in, and the font for anything that declares nothing else.
  #               Defaults to the document's own xml:lang; only Hebrew (he, he-*)
  #               vs. everything else matters. Each run carries its own direction
  #               inside that, so digits and mixed scripts are never reversed.
  #   if        - when this template expands to nothing, the whole position is
  #               dropped, literal text included.
  #
  # Text outside braces is literal; `{{` and `}}` are literal braces. The codes
  # are a closed list — an unrecognized one is an error:
  #   {page}                   page number as the document numbers it
  #   {page-hebrew}            page number in Hebrew numerals
  #   {document-title}         title from the TEI header (fixed for the document)
  #   {book-title}             head of the enclosing div[@type='book']
  #   {chapter-number}         n of the last chapter milestone
  #   {chapter-number-hebrew}  the same, in Hebrew numerals
  #   {head1} ... {head4}      last heading at that level
  #   {section-title}          last heading at any level
  #   {book-title-alt}, {head1-alt} ... {head4-alt}, {section-title-alt}
  #                            the same, from the second parallel column
  #
  # Everything but the page number and document title names what was in force at
  # the *end* of the page. Title pages never carry a running head or foot.
  page_header:
    odd:
      left: "{book-title}"
      right: {text: "Page {page}", language: en}
    even:
      left: {text: "{page-hebrew}", language: he}
      center: {text: "Chapter {chapter-number}", language: en, if: "{chapter-number}"}
  page_footer:
    all:
      center: {text: "{page}", language: en}
