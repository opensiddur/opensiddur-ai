# Spellings of Hebrew words in project names, file names and URN path components.
# See specs/NAMING_SCHEME.md. Checked by `python -m opensiddur.common.validate_names`.
#
# The table in schema/JLPTEI-3.md#transliteration decides a word's spelling. These lists
# record the decisions the table does not make by itself.

# Words whose common spelling wins over the table. Only a word with a spelling of its own in
# English belongs here: kaddish and kiddush are English words, kedushah and qadosh are not.
exceptions:
  - humash      # the table gives hummash
  - kaddish     # qaddish
  - kiddush     # qiddush

# A spelling that is not standard, and the standard spelling of the same word. List a word
# only if it cannot be another word: `lecha` could be לְךָ (`lekha`) or לְכָה (`lekhah`), so
# it is not a variant of either.
variants:
  # Common spellings
  chumash: humash
  chummash: humash
  qaddish: kaddish
  qiddush: kiddush
  # Het is h, never ch
  anachnu: anahnu
  berachamim: berahamim
  chanukah: hanukkah
  chanukkah: hanukkah
  chayim: hayyim
  chayyim: hayyim
  chodesh: hodesh
  chol: hol
  echad: ehad
  menuchah: menuhah
  minchat: minhat
  pachdekha: pahdekha
  rachamekha: rahamekha
  rachamim: rahamim
  rachem: rahem
  rachum: rahum
  selichah: selihah
  selichot: selihot
  tachanun: tahanun
  vaanachnu: vaanahnu
  vechartanu: vehartanu
  # Khaf is kh, not ch
  barech: barekh
  baruch: barukh
  bechol: bekhol
  birchot: birkhot
  melech: melekh
  # Qof is q, not k
  kadosh: qadosh
  kedem: qedem
  kedoshekha: qedoshekha
  kedushah: qedushah
  kedushat: qedushat
  kolenu: qolenu
  pesukim: pesuqim
  # Tzadi is tz, not ts
  haarets: haaretz
  mitratseh: mitratzeh
  ratson: ratzon
  tsaddiq: tzaddiq
  tsarah: tzarah
  tsom: tzom
  tsur: tzur
  yotser: yotzer
  # Dagesh hazak doubles within a word
  amekha: ammekha
  atah: attah
  hakahal: haqahal
  hateh: hatteh
  imanu: immanu
  imekha: immekha
  kama: kammah
  kamah: kammah
  kiviti: qivviti
  makot: makkot
  nekadesh: neqaddesh
  neqadesh: neqaddesh
  ribono: ribbono
  tefilah: tefillah
  tefilat: tefillat
  tikanta: tiqqanta
  tiqanta: tiqqanta
  tsadiq: tzaddiq
  tzadiqim: tzaddiqim
  tzaddikim: tzaddiqim
  # but not after a prefix
  bammeh: bameh
  mikkol: mikol
  miqqedem: miqedem
  # Segol + yod is ei
  vetechezenah: vetehezeinah
  vetehezena: vetehezeinah
  # A final heh is written
  avoda: avodah
  hashana: hashanah
  menucha: menuhah
  moshe: mosheh
  retze: retzeh
  shuva: shuvah
  yehuda: yehudah
