name: Release book

# Builds one book, opensiddur-projects/settings/<book>/<variant>.yaml, at an opensiddur-projects
# commit with an opensiddur-ai release, in the forms its `formats:` lists (both, unless it says
# otherwise), and attaches them to the caller's release of `tag`: the electronic book as
# <book>-<variant>-<tag>.html (opensiddur-ai#92) and the printed one as
# <book>-<variant>-<tag>.pdf (opensiddur-ai#153). A book with no printed form skips TeX entirely.
#
# The electronic book is built first. It takes seconds where the PDF can take hours, and a PDF
# that fails or times out does not keep it off the release. Each form has its own output
# directory, so each keeps its own log.
#
# release-projects.yml runs this once per settings file, for a release of opensiddur-projects
# (opensiddur-ai#216); the release is the caller's, so this has no workflow_dispatch of its own.
# To rebuild a single book, run opensiddur-projects' release.yml with its tag and book.

on:
  workflow_call:
    inputs:
      tag:
        description: The caller's release to attach the book to (e.g. v20261101)
        type: string
        required: true
      book:
        description: The settings file to build, as <book>/<variant> (e.g. humash/annual)
        type: string
        required: true
      projects_ref:
        description: The opensiddur-projects commit to build the book from
        type: string
        required: true
      ai_ref:
        description: The opensiddur-ai release to build it with (e.g. v0.7.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  book:
    runs-on: ubuntu-latest
    # The full humash takes about 90 minutes to typeset on a desktop.
    timeout-minutes: 330
    env:
      TAG: ${{ inputs.tag }}
      BOOK: ${{ inputs.book }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout opensiddur-ai ${{ inputs.ai_ref }}
        uses: actions/checkout@v5
        with:
          repository: opensiddur/opensiddur-ai
          ref: refs/tags/${{ inputs.ai_ref }}

      # Where the submodule would be, so the exporters find it by default. Only
      # opensiddur-projects is needed: the books are built from it, not from sourcetexts.
      - name: Checkout opensiddur-projects
        uses: actions/checkout@v5
        with:
          repository: opensiddur/opensiddur-projects
          ref: ${{ inputs.projects_ref }}
          path: opensiddur-projects

      # Before either build: checking a book's settings checks that its fonts are installed.
      - name: Install fonts
        run: |
          sudo apt-get install --no-install-recommends --no-install-suggests -y \
            culmus fonts-linuxlibertine fonts-sil-ezra fonts-freefont-otf
          fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Read the forms the book is built in
        id: forms
        run: |
          formats=$(uv run python -m opensiddur.exporter.books "$BOOK" --formats)
          echo "Formats: $formats"
          echo "formats=$formats" >> "$GITHUB_OUTPUT"

      - name: Build reference database
        run: uv run python -m opensiddur.exporter.refdb

      - name: Build the electronic book
        if: contains(fromJSON(steps.forms.outputs.formats), 'html')
        run: |
          uv run python -m opensiddur.exporter.books "$BOOK" --format html \
            --output-directory "$RUNNER_TEMP/books/html" --suffix "$TAG"

      - name: Attach the electronic book to the release
        if: contains(fromJSON(steps.forms.outputs.formats), 'html')
        run: gh release upload "$TAG" "$RUNNER_TEMP"/books/html/*.html --clobber

      - name: Install TeX
        if: ${{ !cancelled() && contains(fromJSON(steps.forms.outputs.formats), 'pdf') }}
        run: sudo bash opensiddur/exporter/tex/install-tex.sh

      - name: Build the printed book
        id: pdf
        if: ${{ !cancelled() && contains(fromJSON(steps.forms.outputs.formats), 'pdf') }}
        run: |
          uv run python -m opensiddur.exporter.books "$BOOK" --format pdf \
            --output-directory "$RUNNER_TEMP/books/pdf" --suffix "$TAG"

      - name: Attach the printed book to the release
        if: ${{ !cancelled() && steps.pdf.outcome == 'success' }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/books/pdf/*.pdf --clobber

      - name: Name the log artifact
        if: always()
        run: echo "ARTIFACT=book-log-${BOOK//\//-}-$TAG" >> "$GITHUB_ENV"

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/books/*/*.log
          if-no-files-found: ignore
