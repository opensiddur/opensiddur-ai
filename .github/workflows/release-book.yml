name: Release book

# Builds one book, opensiddur-projects/settings/<book>/<variant>.yaml, at the
# opensiddur-projects commit a release tag pins, in both its forms, and attaches them to that
# release: the electronic book as <book>-<variant>-<tag>.html (opensiddur-ai#92) and the printed
# one as <book>-<variant>-<tag>.pdf (opensiddur-ai#153).
#
# The electronic book is built first. It takes seconds where the PDF can take hours, and a PDF
# that fails or times out does not keep it off the release. Each form has its own output
# directory, so each keeps its own log.
#
# release-books.yml runs this once per settings file. Run it by hand to rebuild a single book
# for a tag; the new files replace the old ones.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      book:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the book for and attach it to (e.g. v0.5.0)
        required: true
        type: string
      book:
        description: The settings file to build, as <book>/<variant> (e.g. humash/annual)
        required: true
        type: string

permissions:
  contents: write

jobs:
  book:
    runs-on: ubuntu-latest
    # The full humash takes about 90 minutes to typeset on a desktop.
    timeout-minutes: 330
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAG: ${{ inputs.tag }}
      BOOK: ${{ inputs.book }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout the release
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      # .gitmodules uses SSH URLs, which the runner can't use. Only opensiddur-projects is
      # needed: the books are built from it, not from sourcetexts.
      - name: Checkout pinned opensiddur-projects
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 opensiddur-projects

      # Before either build: checking a book's settings checks that its fonts are installed.
      - name: Install fonts
        run: |
          sudo apt-get install --no-install-recommends --no-install-suggests -y \
            culmus fonts-linuxlibertine fonts-sil-ezra fonts-freefont-otf
          fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build reference database
        run: uv run python -m opensiddur.exporter.refdb

      - name: Build the electronic book
        run: |
          uv run python -m opensiddur.exporter.books "$BOOK" --format html \
            --output-directory "$RUNNER_TEMP/books/html" --suffix "$TAG"

      - name: Attach the electronic book to the release
        run: gh release upload "$TAG" "$RUNNER_TEMP"/books/html/*.html --clobber

      - name: Install TeX
        if: ${{ !cancelled() }}
        run: sudo bash opensiddur/exporter/tex/install-tex.sh

      - name: Build the printed book
        id: pdf
        if: ${{ !cancelled() }}
        run: |
          uv run python -m opensiddur.exporter.books "$BOOK" --format pdf \
            --output-directory "$RUNNER_TEMP/books/pdf" --suffix "$TAG"

      - name: Attach the printed book to the release
        if: ${{ !cancelled() && steps.pdf.outcome == 'success' }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/books/pdf/*.pdf --clobber

      - name: Name the log artifact
        if: always()
        run: echo "ARTIFACT=book-log-${BOOK//\//-}-$TAG" >> "$GITHUB_ENV"

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/books/*/*.log
          if-no-files-found: ignore
