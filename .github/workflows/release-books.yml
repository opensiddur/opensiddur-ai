name: Release books

# Builds a printed book (PDF) for every settings file in opensiddur-projects/settings/<book>/, at the
# opensiddur-projects commit the release pins, and attaches them to the release (opensiddur-ai#153).
#
# A book that fails to build is left out and the others are still attached; the run then fails,
# so a release with missing books shows red. Rerun for a tag with workflow_dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the books for and attach them to (e.g. v0.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-books-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout the release
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      # .gitmodules uses SSH URLs, which the runner can't use. Only opensiddur-projects is
      # needed: the books are built from it, not from sourcetexts.
      - name: Checkout pinned opensiddur-projects
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 opensiddur-projects

      - name: Install TeX
        run: sudo bash opensiddur/exporter/tex/install-tex.sh

      - name: Install fonts
        run: |
          sudo apt-get install --no-install-recommends --no-install-suggests -y \
            culmus fonts-linuxlibertine fonts-sil-ezra fonts-freefont-otf
          fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build reference database
        run: uv run python -m opensiddur.exporter.refdb

      - name: Build books
        id: build
        continue-on-error: true
        run: |
          uv run python -m opensiddur.exporter.books \
            --output-directory "$RUNNER_TEMP/books" --suffix "$TAG"

      - name: Attach books to the release
        if: always()
        run: |
          shopt -s nullglob
          pdfs=("$RUNNER_TEMP"/books/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No books were built."
            exit 0
          fi
          gh release upload "$TAG" "${pdfs[@]}" --clobber

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-logs-${{ env.TAG }}
          path: ${{ runner.temp }}/books/*.log
          if-no-files-found: ignore

      - name: Fail if any book failed
        if: steps.build.outcome != 'success'
        run: |
          echo "At least one book failed to build; see the Build books step and the book-logs artifact."
          exit 1
