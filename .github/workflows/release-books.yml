name: Release books

# Builds every book in opensiddur-projects/settings/<book>/, at the opensiddur-projects commit the
# release pins, as an electronic book (HTML) and a printed one (PDF), and attaches them to the
# release (opensiddur-ai#92, #153).
#
# One job lists the settings files; each is then built by its own run of release-book.yml, so a
# book has its own log, status and timeout, and a failing or slow book holds up no other. A book
# that fails is not attached and its job fails, so a release with missing books shows red.
# Rebuild everything for a tag with workflow_dispatch here, or one book with release-book.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the books for and attach them to (e.g. v0.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-books-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      tag: ${{ env.TAG }}
      books: ${{ steps.list.outputs.books }}

    steps:
      - name: Checkout the release
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      # .gitmodules uses SSH URLs, which the runner can't use.
      - name: Checkout pinned opensiddur-projects
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 opensiddur-projects

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: List settings files
        id: list
        run: |
          books=$(uv run python -m opensiddur.exporter.books --list)
          echo "Books: $books"
          echo "books=$books" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.books != '[]'
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJSON(needs.discover.outputs.books) }}
    name: ${{ matrix.book }}
    uses: ./.github/workflows/release-book.yml
    with:
      tag: ${{ needs.discover.outputs.tag }}
      book: ${{ matrix.book }}
