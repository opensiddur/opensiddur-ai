# https://docs.codecov.com/docs/commit-status
coverage:
  status:
    project:
      default:
        target: 85%
        informational: false
    patch:
      default:
        target: 85%
        informational: false

# Edition recipes and one-off inspection commands; shared scan algorithms remain covered.
